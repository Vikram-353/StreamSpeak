<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Speech bubble gradient -->
    <linearGradient id="bubbleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    
    <!-- Play button gradient -->
    <linearGradient id="playGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a67d8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    
    <!-- Inner shadow for bubble -->
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.05"/>
      <feComposite in2="offset-blur" operator="in"/>
    </filter>
  </defs>
  
  <!-- App icon background with rounded corners -->
  <rect width="400" height="400" rx="88" ry="88" fill="url(#bgGradient)"/>
  
  <!-- Main speech bubble -->
  <g transform="translate(200, 180)">
    <!-- Speech bubble main body -->
    <rect x="-85" y="-65" width="170" height="110" rx="28" ry="28" 
          fill="url(#bubbleGradient)" 
          filter="url(#shadow)"
          stroke="#e2e8f0" 
          stroke-width="1"/>
    
    <!-- Speech bubble tail -->
    <path d="M -45 45 L -25 65 L -15 45 Z" 
          fill="url(#bubbleGradient)" 
          stroke="#e2e8f0" 
          stroke-width="1"/>
    
    <!-- Play button circle -->
    <circle cx="0" cy="-10" r="32" 
            fill="url(#playGradient)" 
            filter="url(#shadow)"/>
    
    <!-- Play triangle -->
    <path d="M -12 -25 L -12 5 L 18 -10 Z" 
          fill="#ffffff" 
          stroke="none"/>
  </g>
  
  <!-- App title -->
  <text x="200" y="320" 
        font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" 
        font-size="42" 
        font-weight="700" 
        text-anchor="middle" 
        fill="#ffffff" 
        opacity="0.95">
    StreamSpeak
  </text>
  
  <!-- Subtle accent dots for modern touch -->
  <circle cx="320" cy="100" r="3" fill="#ffffff" opacity="0.3"/>
  <circle cx="340" cy="85" r="2" fill="#ffffff" opacity="0.2"/>
  <circle cx="305" cy="75" r="1.5" fill="#ffffff" opacity="0.4"/>
</svg>